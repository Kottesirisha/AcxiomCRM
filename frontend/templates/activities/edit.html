{% extends 'base.html' %}
{% block title %}Edit Activity{% endblock %}
{% block breadcrumb %}
<li class="breadcrumb-item"><a href="{{ url_for('dashboard.index') }}">Dashboard</a></li>
<li class="breadcrumb-item"><a href="{{ url_for('activities.list_activities') }}">Activities</a></li>
<li class="breadcrumb-item active">Edit</li>
{% endblock %}
{% block content %}
<div class="page-header"><h1><i class="bi bi-pencil me-2"></i>Edit Activity</h1></div>
<div class="card"><div class="card-body">
    <form method="POST">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>
        <div class="row">
            <div class="col-md-6 mb-3">
                <label class="form-label">Subject <span class="text-danger">*</span></label>
                <input type="text" class="form-control" name="subject" required value="{{ activity.subject }}">
            </div>
            <div class="col-md-3 mb-3">
                <label class="form-label">Type <span class="text-danger">*</span></label>
                <select class="form-select" name="type" required>
                    {% for t in ['Call','Meeting','Email','Task'] %}<option value="{{ t }}" {% if activity.type == t %}selected{% endif %}>{{ t }}</option>{% endfor %}
                </select>
            </div>
            <div class="col-md-3 mb-3">
                <label class="form-label">Date</label>
                <input type="datetime-local" class="form-control" name="activity_date" value="{{ activity.activity_date.strftime('%Y-%m-%dT%H:%M') if activity.activity_date else '' }}">
            </div>
            <div class="col-md-4 mb-3">
                <label class="form-label">Customer</label>
                <select class="form-select" name="customer_id">
                    <option value="">None</option>
                    {% for c in customers %}<option value="{{ c.id }}" {% if activity.customer_id == c.id %}selected{% endif %}>{{ c.name }}</option>{% endfor %}
                </select>
            </div>
            <div class="col-md-4 mb-3">
                <label class="form-label">Lead</label>
                <select class="form-select" name="lead_id">
                    <option value="">None</option>
                    {% for l in leads %}<option value="{{ l.id }}" {% if activity.lead_id == l.id %}selected{% endif %}>{{ l.name }}</option>{% endfor %}
                </select>
            </div>
            <div class="col-md-4 mb-3">
                <label class="form-label">Opportunity</label>
                <select class="form-select" name="opportunity_id">
                    <option value="">None</option>
                    {% for o in opportunities %}<option value="{{ o.id }}" {% if activity.opportunity_id == o.id %}selected{% endif %}>{{ o.name }}</option>{% endfor %}
                </select>
            </div>
            <div class="col-md-6 mb-3">
                <label class="form-label">Assigned To</label>
                <select class="form-select" name="assigned_to">
                    <option value="">Select User</option>
                    {% for u in users %}<option value="{{ u.id }}" {% if activity.assigned_to == u.id %}selected{% endif %}>{{ u.full_name }}</option>{% endfor %}
                </select>
            </div>
            <div class="col-md-6 mb-3">
                <label class="form-label">Status</label>
                <select class="form-select" name="status">
                    {% for s in ['Planned','Completed','Cancelled'] %}<option value="{{ s }}" {% if activity.status == s %}selected{% endif %}>{{ s }}</option>{% endfor %}
                </select>
            </div>
            <div class="col-12 mb-3">
                <label class="form-label">Description</label>
                <textarea class="form-control" name="description" rows="3">{{ activity.description or '' }}</textarea>
            </div>
        </div>
        <div class="d-flex gap-2">
            <button type="submit" class="btn btn-primary"><i class="bi bi-check-lg me-1"></i>Update</button>
            <a href="{{ url_for('activities.detail', id=activity.id) }}" class="btn btn-outline-secondary">Cancel</a>
        </div>
    </form>
</div></div>
{% endblock %}
