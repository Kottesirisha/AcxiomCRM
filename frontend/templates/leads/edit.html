{% extends 'base.html' %}
{% block title %}Edit Lead{% endblock %}
{% block breadcrumb %}
<li class="breadcrumb-item"><a href="{{ url_for('dashboard.index') }}">Dashboard</a></li>
<li class="breadcrumb-item"><a href="{{ url_for('leads.list_leads') }}">Leads</a></li>
<li class="breadcrumb-item active">Edit</li>
{% endblock %}
{% block content %}
<div class="page-header"><h1><i class="bi bi-pencil me-2"></i>Edit Lead</h1></div>
<div class="card">
    <div class="card-body">
        <form method="POST">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>
            <div class="row">
                <div class="col-md-6 mb-3">
                    <label class="form-label">Name <span class="text-danger">*</span></label>
                    <input type="text" class="form-control" name="name" required value="{{ lead.name }}">
                </div>
                <div class="col-md-6 mb-3">
                    <label class="form-label">Email</label>
                    <input type="email" class="form-control" name="email" value="{{ lead.email or '' }}">
                </div>
                <div class="col-md-6 mb-3">
                    <label class="form-label">Phone</label>
                    <input type="text" class="form-control" name="phone" value="{{ lead.phone or '' }}">
                </div>
                <div class="col-md-6 mb-3">
                    <label class="form-label">Company</label>
                    <input type="text" class="form-control" name="company" value="{{ lead.company or '' }}">
                </div>
                <div class="col-md-6 mb-3">
                    <label class="form-label">Source</label>
                    <select class="form-select" name="source">
                        <option value="">Select Source</option>
                        {% for s in ['Web','Referral','Cold Call','Advertisement','Partner','Other'] %}
                        <option value="{{ s }}" {% if lead.source == s %}selected{% endif %}>{{ s }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="col-md-3 mb-3">
                    <label class="form-label">Status</label>
                    <select class="form-select" name="status">
                        {% for s in ['New','Contacted','Qualified','Unqualified'] %}
                        <option value="{{ s }}" {% if lead.status == s %}selected{% endif %}>{{ s }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="col-md-3 mb-3">
                    <label class="form-label">Rating</label>
                    <select class="form-select" name="rating">
                        <option value="">Select Rating</option>
                        {% for r in ['Hot','Warm','Cold'] %}
                        <option value="{{ r }}" {% if lead.rating == r %}selected{% endif %}>{{ r }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="col-md-6 mb-3">
                    <label class="form-label">Assigned To</label>
                    <select class="form-select" name="assigned_to">
                        <option value="">Select User</option>
                        {% for u in users %}
                        <option value="{{ u.id }}" {% if lead.assigned_to == u.id %}selected{% endif %}>{{ u.full_name }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="col-12 mb-3">
                    <label class="form-label">Description</label>
                    <textarea class="form-control" name="description" rows="3">{{ lead.description or '' }}</textarea>
                </div>
            </div>
            <div class="d-flex gap-2">
                <button type="submit" class="btn btn-primary"><i class="bi bi-check-lg me-1"></i>Update Lead</button>
                <a href="{{ url_for('leads.detail', id=lead.id) }}" class="btn btn-outline-secondary">Cancel</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
