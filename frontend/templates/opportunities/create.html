{% extends 'base.html' %}
{% block title %}Add Opportunity{% endblock %}
{% block breadcrumb %}
<li class="breadcrumb-item"><a href="{{ url_for('dashboard.index') }}">Dashboard</a></li>
<li class="breadcrumb-item"><a href="{{ url_for('opportunities.list_opportunities') }}">Opportunities</a></li>
<li class="breadcrumb-item active">Add</li>
{% endblock %}
{% block content %}
<div class="page-header"><h1><i class="bi bi-graph-up-arrow me-2"></i>Add Opportunity</h1></div>
<div class="card">
    <div class="card-body">
        <form method="POST">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>
            <div class="row">
                <div class="col-md-6 mb-3">
                    <label class="form-label">Name <span class="text-danger">*</span></label>
                    <input type="text" class="form-control" name="name" required value="{{ request.form.get('name','') }}">
                </div>
                <div class="col-md-6 mb-3">
                    <label class="form-label">Customer <span class="text-danger">*</span></label>
                    <select class="form-select" name="customer_id" required>
                        <option value="">Select Customer</option>
                        {% for c in customers %}
                        <option value="{{ c.id }}" {% if request.args.get('customer_id', request.form.get('customer_id',''))|string == c.id|string %}selected{% endif %}>{{ c.name }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="col-md-4 mb-3">
                    <label class="form-label">Amount <span class="text-danger">*</span></label>
                    <div class="input-group">
                        <span class="input-group-text">$</span>
                        <input type="number" class="form-control" name="amount" step="0.01" min="0.01" required value="{{ request.form.get('amount','0') }}">
                    </div>
                </div>
                <div class="col-md-4 mb-3">
                    <label class="form-label">Stage</label>
                    <select class="form-select" name="stage" id="stage">
                        {% for s in ['Qualification','Needs Analysis','Proposal','Negotiation','Closed Won','Closed Lost'] %}
                        <option value="{{ s }}" {% if request.form.get('stage','Qualification') == s %}selected{% endif %}>{{ s }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="col-md-4 mb-3">
                    <label class="form-label">Probability (%)</label>
                    <input type="number" class="form-control" name="probability" id="probability" min="0" max="100" value="{{ request.form.get('probability','10') }}">
                </div>
                <div class="col-md-6 mb-3">
                    <label class="form-label">Expected Close Date</label>
                    <input type="date" class="form-control" name="expected_close_date" value="{{ request.form.get('expected_close_date','') }}">
                </div>
                <div class="col-md-6 mb-3">
                    <label class="form-label">Assigned To</label>
                    <select class="form-select" name="assigned_to">
                        <option value="">Select User</option>
                        {% for u in users %}
                        <option value="{{ u.id }}">{{ u.full_name }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="col-12 mb-3">
                    <label class="form-label">Description</label>
                    <textarea class="form-control" name="description" rows="3">{{ request.form.get('description','') }}</textarea>
                </div>
            </div>
            <div class="d-flex gap-2">
                <button type="submit" class="btn btn-primary"><i class="bi bi-check-lg me-1"></i>Save Opportunity</button>
                <a href="{{ url_for('opportunities.list_opportunities') }}" class="btn btn-outline-secondary">Cancel</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
