{% extends 'base.html' %}
{% block title %}Edit Customer{% endblock %}
{% block breadcrumb %}
<li class="breadcrumb-item"><a href="{{ url_for('dashboard.index') }}">Dashboard</a></li>
<li class="breadcrumb-item"><a href="{{ url_for('customers.list_customers') }}">Customers</a></li>
<li class="breadcrumb-item active">Edit</li>
{% endblock %}
{% block content %}
<div class="page-header">
    <h1><i class="bi bi-pencil me-2"></i>Edit Customer</h1>
</div>
<div class="card">
    <div class="card-body">
        <form method="POST">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>
            <div class="row">
                <div class="col-md-6 mb-3">
                    <label class="form-label">Name <span class="text-danger">*</span></label>
                    <input type="text" class="form-control" name="name" required value="{{ customer.name }}">
                </div>
                <div class="col-md-6 mb-3">
                    <label class="form-label">Email</label>
                    <input type="email" class="form-control" name="email" value="{{ customer.email or '' }}">
                </div>
                <div class="col-md-6 mb-3">
                    <label class="form-label">Phone</label>
                    <input type="text" class="form-control" name="phone" value="{{ customer.phone or '' }}">
                </div>
                <div class="col-md-6 mb-3">
                    <label class="form-label">Company</label>
                    <input type="text" class="form-control" name="company" value="{{ customer.company or '' }}">
                </div>
                <div class="col-md-6 mb-3">
                    <label class="form-label">Industry</label>
                    <select class="form-select" name="industry">
                        <option value="">Select Industry</option>
                        {% for ind in ['Technology','Healthcare','Finance','Manufacturing','Retail','Education','Other'] %}
                        <option value="{{ ind }}" {% if customer.industry == ind %}selected{% endif %}>{{ ind }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="col-md-6 mb-3">
                    <label class="form-label">Assigned To</label>
                    <select class="form-select" name="assigned_to">
                        <option value="">Select User</option>
                        {% for u in users %}
                        <option value="{{ u.id }}" {% if customer.assigned_to == u.id %}selected{% endif %}>{{ u.full_name }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="col-md-12 mb-3">
                    <label class="form-label">Address</label>
                    <input type="text" class="form-control" name="address" value="{{ customer.address or '' }}">
                </div>
                <div class="col-md-4 mb-3">
                    <label class="form-label">City</label>
                    <input type="text" class="form-control" name="city" value="{{ customer.city or '' }}">
                </div>
                <div class="col-md-4 mb-3">
                    <label class="form-label">State</label>
                    <input type="text" class="form-control" name="state" value="{{ customer.state or '' }}">
                </div>
                <div class="col-md-4 mb-3">
                    <label class="form-label">Country</label>
                    <input type="text" class="form-control" name="country" value="{{ customer.country or '' }}">
                </div>
            </div>
            <div class="d-flex gap-2">
                <button type="submit" class="btn btn-primary"><i class="bi bi-check-lg me-1"></i>Update Customer</button>
                <a href="{{ url_for('customers.detail', id=customer.id) }}" class="btn btn-outline-secondary">Cancel</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
