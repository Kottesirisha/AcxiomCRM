{% extends 'base.html' %}
{% block title %}Server Error{% endblock %}
{% block content %}
<div class="empty-state" style="padding:5rem 1rem;">
    <i class="bi bi-exclamation-triangle" style="font-size:4rem;color:#F59E0B;"></i>
    <h3 class="mt-3">Something Went Wrong</h3>
    <p class="text-muted">An unexpected error occurred. Please try again later.</p>
    <a href="{{ url_for('dashboard.index') }}" class="btn btn-primary mt-2"><i class="bi bi-house me-2"></i>Back to Dashboard</a>
</div>
{% endblock %}
