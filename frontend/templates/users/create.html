{% extends 'base.html' %}
{% block title %}Add User{% endblock %}
{% block breadcrumb %}
<li class="breadcrumb-item"><a href="{{ url_for('dashboard.index') }}">Dashboard</a></li>
<li class="breadcrumb-item"><a href="{{ url_for('users.list_users') }}">Users</a></li>
<li class="breadcrumb-item active">Add User</li>
{% endblock %}
{% block content %}
<div class="page-header"><h1><i class="bi bi-person-plus me-2"></i>Add User</h1></div>
<div class="card"><div class="card-body">
    <form method="POST">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>
        <div class="row">
            <div class="col-md-6 mb-3"><label class="form-label">First Name <span class="text-danger">*</span></label><input type="text" class="form-control" name="first_name" required value="{{ request.form.get('first_name','') }}"></div>
            <div class="col-md-6 mb-3"><label class="form-label">Last Name <span class="text-danger">*</span></label><input type="text" class="form-control" name="last_name" required value="{{ request.form.get('last_name','') }}"></div>
            <div class="col-md-6 mb-3"><label class="form-label">Email <span class="text-danger">*</span></label><input type="email" class="form-control" name="email" required value="{{ request.form.get('email','') }}"></div>
            <div class="col-md-6 mb-3"><label class="form-label">Password <span class="text-danger">*</span></label><input type="password" class="form-control" name="password" required minlength="6"></div>
            <div class="col-md-6 mb-3"><label class="form-label">Phone</label><input type="text" class="form-control" name="phone" value="{{ request.form.get('phone','') }}"></div>
            <div class="col-md-6 mb-3"><label class="form-label">Role <span class="text-danger">*</span></label>
                <select class="form-select" name="role_id" required>
                    {% for r in roles %}<option value="{{ r.id }}">{{ r.name }}</option>{% endfor %}
                </select>
            </div>
            <div class="col-md-6 mb-3">
                <div class="form-check mt-4"><input class="form-check-input" type="checkbox" id="is_active" name="is_active" checked><label class="form-check-label" for="is_active">Active</label></div>
            </div>
        </div>
        <div class="d-flex gap-2">
            <button type="submit" class="btn btn-primary"><i class="bi bi-check-lg me-1"></i>Create User</button>
            <a href="{{ url_for('users.list_users') }}" class="btn btn-outline-secondary">Cancel</a>
        </div>
    </form>
</div></div>
{% endblock %}
